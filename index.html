<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#c7f4e9"><title>楽曲検索補助ツール | pop'n music</title><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><header><div class="eyebrow">♪ POP'N MUSIC SONG FINDER ♪</div><h1>楽曲検索補助ツール</h1></header><main><section class="filters"><div class="field"><label for="search">曲名・ジャンル・アーティスト・作品名</label><input id="search" type="search" placeholder="キーワードを入力してね ♪" autocomplete="off"></div><div class="mode" id="modes"><button class="active" data-mode="acOnly">♥ AC限定</button><button data-mode="all">すべて</button><button data-mode="both">AC＋Lively</button><button data-mode="livelyOnly">Livelyのみ</button><button data-mode="check">要確認</button></div><div class="options"><div class="field"><label for="difficulty">難易度</label><select id="difficulty"><option value="EX">EX</option><option value="H">HYPER</option><option value="N">NORMAL</option><option value="E">EASY</option><option value="L">LIGHT</option></select></div><div class="field"><label for="min">Lv（下限）</label><select id="min"></select></div><div class="field"><label for="max">Lv（上限）</label><select id="max"></select></div><div class="field"><label for="bpm">BPM</label><input id="bpm" type="number" min="1" placeholder="例：180以上"></div><div class="field"><label for="version">初登場・分類</label><select id="version"><option value="">すべての作品</option></select></div><div class="field"><label for="sort">並び順</label><select id="sort"><option value="title">曲名順</option><option value="levelDesc">レベル高い順</option><option value="levelAsc">レベル低い順</option><option value="bpmDesc">BPM高い順</option></select></div></div><div class="actions"><label class="toggle"><input type="checkbox" id="hasLevel"> 選択した難易度の譜面がある曲のみ</label><button id="reset">条件をリセット ↺</button></div></section><div class="summary"><div><strong id="count">読み込み中…</strong><small id="subtitle">AC限定 = 現行AC収録・Lively未収録</small></div><div class="decor">✿ ♫ ✿</div></div><section id="results" class="results"></section><button id="more" class="more" hidden>もっと見る ♡</button><footer>収録データは提供されたBEMANIWiki 2nd・KONAMI公式HTMLを元に作成した参考情報です。<br>更新時点以降の配信・削除は反映されません。表記差や照合漏れの可能性があります。</footer></main></div><script src="app.js"></script></body></html>
